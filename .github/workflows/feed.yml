name: Обновление фида

on:
  schedule:
    - cron: "17 2 * * *"   # каждый день в 05:17 по Москве
  workflow_dispatch:         # кнопка ручного запуска
  push:
    paths:
      - semplery_feed.py     # пересборка сразу после обновления скрипта

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml
      - run: python semplery_feed.py
      - name: Сохранить фид
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add semplery_feed.xml
          git commit -m "Обновление фида" || exit 0
          git push
